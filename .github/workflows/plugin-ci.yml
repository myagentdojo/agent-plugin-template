name: Prove and package plugin

on:
  pull_request:
    paths:
      - "plugin/**"
      - "runtime/src/**"
      - "plugin.config.json"
      - "scripts/**"
      - "package.json"
      - "CHANGELOG.md"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - ".github/.release-please-manifest.json"
      - ".github/release-please-config.json"
      - ".github/workflows/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Compatibility (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun run spike:quickjs:ci

  package:
    name: Deterministic package
    needs: compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun test
      - run: bun run release:validate
      - run: bun run prove:distribution
      - run: bun run prove:dx
      - name: Prove generated runtime was merged with its source
        run: git diff --exit-code -- plugin/runtime/hello-world.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-plugin-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.provenance.json
          if-no-files-found: error

  attest:
    name: Attest main artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download packaged artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "agent-plugin-${GITHUB_SHA}" --dir dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*.tar.gz
