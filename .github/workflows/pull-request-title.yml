name: Pull request title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate title
        run: |
          if [[ "$PR_TITLE" =~ ^(feat|fix|perf|refactor|docs|test|ci|build|chore|revert)(\([a-z0-9._/-]+\))?\!?:\ .+ ]]; then
            exit 0
          fi
          echo "Use a Conventional Commit title, for example: feat: add a portable command" >&2
          exit 1

  release-impact:
    name: Release impact
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Gate payload changes on release intent
        run: bun run scripts/release-impact.ts
