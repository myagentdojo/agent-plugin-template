name: Hosted canary qualification

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: hosted-canary-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify publishing-system paths
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.classify.outputs.required }}
      triggers: ${{ steps.classify.outputs.triggers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Fetch candidate object without executing it
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags "https://github.com/${HEAD_REPOSITORY}.git" "$HEAD_SHA"
      - name: Classify with trusted base code
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          result="$(bun run ship:canary -- --classify --base "$BASE_SHA" --head "$HEAD_SHA" --json)"
          printf '%s\n' "$result"
          printf 'required=%s\n' "$(jq -r '.canaries.required' <<< "$result")" >> "$GITHUB_OUTPUT"
          printf 'triggers=%s\n' "$(jq -c '.canaries.triggeringPaths' <<< "$result")" >> "$GITHUB_OUTPUT"

  qualify:
    name: Qualify immutable hosted candidates
    if: needs.classify.outputs.required == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    needs: classify
    runs-on: ubuntu-24.04
    environment: hosted-canary-qualification
    steps:
      - name: Check out trusted driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check out candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install pinned native marketplace CLIs
        run: bun add --global "@anthropic-ai/claude-code@2.1.222" "@openai/codex@0.146.1"
      - name: Qualify immutable candidates with trusted driver
        env:
          GH_TOKEN: ${{ secrets.CANARY_GH_TOKEN }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          CANARY_QUALIFIED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          CANARY_TRUSTED_WORKFLOW_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test -n "$GH_TOKEN"
          credential_root="$(mktemp -d)"
          chmod 700 "$credential_root"
          credential_socket="$credential_root/cache.sock"
          credential_config="$credential_root/gitconfig"
          git config --file "$credential_config" credential.helper "cache --socket $credential_socket --timeout 1800"
          export GIT_CONFIG_GLOBAL="$credential_config"
          export GIT_CONFIG_NOSYSTEM="1"
          printf 'protocol=https\nhost=github.com\nusername=x-access-token\npassword=%s\n\n' "$GH_TOKEN" | git credential approve
          trap 'git credential-cache --socket "$credential_socket" exit >/dev/null 2>&1 || true; rm -rf "$credential_root"' EXIT
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          bun run ship:canary -- --execute --source-root candidate --ref "$SOURCE_SHA" --json

  result:
    name: Hosted public and private Git canaries
    if: always()
    needs:
      - classify
      - qualify
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce conditional qualification
        env:
          CANARIES_REQUIRED: ${{ needs.classify.outputs.required }}
          CLASSIFICATION_RESULT: ${{ needs.classify.result }}
          QUALIFICATION_RESULT: ${{ needs.qualify.result }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          TRIGGERING_PATHS: ${{ needs.classify.outputs.triggers }}
        run: |
          conclusion=success
          summary="Hosted canaries not required. Publishing-system triggers: ${TRIGGERING_PATHS}"
          if [ "$CLASSIFICATION_RESULT" != "success" ]; then
            conclusion=failure
            summary="Publishing-system classification failed."
          elif [ "$CANARIES_REQUIRED" = "true" ] && [ "$SAME_REPOSITORY" != "true" ]; then
            conclusion=failure
            summary="Hosted canaries were required for this fork pull request. A maintainer must run qualification from a same-repository branch. Publishing-system triggers: ${TRIGGERING_PATHS}"
          elif [ "$CANARIES_REQUIRED" = "true" ] && [ "$QUALIFICATION_RESULT" != "success" ]; then
            conclusion=failure
            summary="Hosted canaries were required but did not qualify. Publishing-system triggers: ${TRIGGERING_PATHS}"
          elif [ "$CANARIES_REQUIRED" = "true" ]; then
            summary="Hosted public and private Git canaries passed for: ${TRIGGERING_PATHS}"
          fi
          printf '%s\n' "$summary"
          printf '### Hosted canary qualification\n\n%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
          test "$conclusion" = "success"
