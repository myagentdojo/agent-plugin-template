name: Release impact

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read
  statuses: write

env:
  STATUS_CONTEXT: Release impact

concurrency:
  group: release-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify from trusted base code
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      EXPECTED_RELEASE_PLEASE_LOGIN: ${{ vars.RELEASE_PLEASE_AUTOMATION_LOGIN || 'github-actions[bot]' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark the head commit pending
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --raw-field state=pending \
            --raw-field context="${STATUS_CONTEXT}" \
            --raw-field description="Release impact qualification in progress" \
            --raw-field target_url="${PR_URL}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Fetch the pull request head as untrusted data
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Classify payload changes
        id: impact
        continue-on-error: true
        run: >-
          bun run scripts/release-impact.ts
          --pr-head-ref "$PR_HEAD_REF"
          --pr-author-login "$PR_AUTHOR_LOGIN"
          --expected-release-please-login "$EXPECTED_RELEASE_PLEASE_LOGIN"
      - name: Publish the bound result
        if: always()
        env:
          IMPACT_OUTCOME: ${{ steps.impact.outcome }}
        run: |
          state=failure
          description="Release impact qualification failed"
          if [[ "${IMPACT_OUTCOME}" == "success" ]]; then
            if current_pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"); then
              current_head_sha=$(jq -r .head.sha <<< "$current_pr")
              current_title=$(jq -r .title <<< "$current_pr")
            else
              description="Release impact could not read current pull request"
              current_head_sha=""
              current_title=""
            fi
            if [[ -n "$current_head_sha" && "$current_head_sha" == "$HEAD_SHA" ]] && \
              PR_TITLE="$current_title" bun run scripts/release-impact.ts \
                --pr-head-ref "$PR_HEAD_REF" \
                --pr-author-login "$PR_AUTHOR_LOGIN" \
                --expected-release-please-login "$EXPECTED_RELEASE_PLEASE_LOGIN" >/dev/null; then
              if verified_pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"); then
                verified_head_sha=$(jq -r .head.sha <<< "$verified_pr")
                verified_title=$(jq -r .title <<< "$verified_pr")
              else
                description="Release impact could not verify the pull request after qualification"
                verified_head_sha=""
                verified_title=""
              fi
              if [[ -n "$verified_head_sha" && "$verified_head_sha" == "$current_head_sha" && "$verified_title" == "$current_title" ]]; then
                state=success
                description="Release impact qualification passed"
              fi
            elif [[ -n "$current_head_sha" ]]; then
              description="Release impact changed before qualification completed"
            fi
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --raw-field state="${state}" \
            --raw-field context="${STATUS_CONTEXT}" \
            --raw-field description="${description}" \
            --raw-field target_url="${PR_URL}"
          if [[ "${state}" != "success" ]]; then
            exit 1
          fi
