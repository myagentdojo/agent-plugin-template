name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag whose assets need repair; leave empty for normal release maintenance
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: Release compatibility (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun run spike:quickjs:ci

  package:
    name: Prove release candidate
    needs: compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Validate and prove release payload
        run: bun run prove:all
      - name: Reject generated runtime drift
        run: git diff --exit-code -- plugin/runtime/hello-world.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: |
            dist/*.tar.gz
            dist/*.provenance.json
          if-no-files-found: error

  release:
    name: Maintain release PR or publish
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      attestations: write
    steps:
      - name: Download proven release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-candidate-${GITHUB_RUN_ID}" --dir dist
      - name: Maintain release PR or publish merged release
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
      - name: Attach deterministic plugin package
        if: steps.release.outputs.release_created == 'true' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || steps.release.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.provenance.json --clobber
      - name: Attest public release archive
        if: (steps.release.outputs.release_created == 'true' || inputs.release_tag != '') && github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*.tar.gz
