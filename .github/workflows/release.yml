name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Maintain the release PR or repair an admitted immutable release
        required: true
        default: maintenance
        type: choice
        options:
          - maintenance
          - repair
      release_tag:
        description: Existing vX.Y.Z tag whose incomplete publication needs repair
        required: false
        type: string
      replace_mismatched_assets:
        description: Replace mismatched same-tag assets after release-environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve publication state
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_target_sha: ${{ steps.resolve.outputs.release_target_sha }}
      trusted_base_sha: ${{ steps.resolve.outputs.trusted_base_sha }}
      merged_pr_base_sha: ${{ steps.resolve.outputs.merged_pr_base_sha }}
      reviewed_pr_head_sha: ${{ steps.resolve.outputs.reviewed_pr_head_sha }}
      record_reused: ${{ steps.resolve.outputs.record_reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Resolve unique candidate or immutable repair tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: main
          EXPECTED_RELEASE_PLEASE_LOGIN: ${{ vars.RELEASE_PLEASE_AUTOMATION_LOGIN || 'github-actions[bot]' }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
          REPAIR_TAG: ${{ inputs.release_tag }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/${BASE_BRANCH}" ]]; then
              echo "Manual release operations must run from refs/heads/${BASE_BRANCH}, not ${GITHUB_REF}." >&2
              exit 1
            fi
            if [[ "$OPERATION" == "maintenance" ]]; then
              {
                echo "mode=maintenance"
                echo "candidate_sha="
                echo "release_tag="
                echo "version="
                echo "release_target_sha="
                echo "trusted_base_sha="
                echo "merged_pr_base_sha="
                echo "reviewed_pr_head_sha="
                echo "record_reused=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$OPERATION" != "repair" ]]; then
              echo "Unsupported manual operation: ${OPERATION}." >&2
              exit 1
            fi
            if [[ -z "$REPAIR_TAG" ]]; then
              echo "Manual repair requires release_tag." >&2
              exit 1
            fi
            workflow_policy_sha=$(git rev-parse HEAD)
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${REPAIR_TAG}" >/dev/null
            candidate_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REPAIR_TAG}" --jq .sha)
            version=${REPAIR_TAG#v}
            release_target_sha=""
            if gh release view "$REPAIR_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              release_target=$(gh release view "$REPAIR_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
              release_target_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_target}" --jq .sha)
            fi

            git fetch --no-tags origin "refs/tags/${REPAIR_TAG}:refs/tags/${REPAIR_TAG}"
            if [[ "$(git cat-file -t "refs/tags/${REPAIR_TAG}")" != "tag" ]]; then
              echo "Repair requires an annotated immutable tag carrying its publication admission." >&2
              exit 1
            fi
            git for-each-ref --format='%(contents)' "refs/tags/${REPAIR_TAG}" > persisted-candidate.json
            pr_number=$(jq -er '.pullRequest | select(type == "number" and . > 0 and . == floor)' persisted-candidate.json)
            admitted_automation_identity=$(jq -er '.automationIdentity | select(type == "string" and length > 0)' persisted-candidate.json)
            if [[ "$admitted_automation_identity" != "$EXPECTED_RELEASE_PLEASE_LOGIN" ]]; then
              echo "Persisted repair identity does not match the configured Release Please identity." >&2
              exit 1
            fi
            release_pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
            base_branch=$(jq -r .base.ref <<< "$release_pr")
            merged_pr_base_sha=$(jq -r .base.sha <<< "$release_pr")
            reviewed_pr_head_sha=$(jq -r .head.sha <<< "$release_pr")
            automation_identity=$(jq -r .user.login <<< "$release_pr")
            merge_commit_sha=$(jq -r .merge_commit_sha <<< "$release_pr")
            merged_at=$(jq -r '.merged_at // empty' <<< "$release_pr")
            if [[ "$automation_identity" != "$EXPECTED_RELEASE_PLEASE_LOGIN" ]]; then
              echo "Fresh repair PR identity does not match the configured Release Please identity." >&2
              exit 1
            fi
            if [[ -z "$merged_at" || "$base_branch" != "$BASE_BRANCH" || "$merge_commit_sha" != "$candidate_sha" ]]; then
              echo "Repair provenance does not match a merged Release Please candidate." >&2
              exit 1
            fi
            candidate_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${candidate_sha}")
            candidate_parent_shas=$(jq -c '[.parents[].sha]' <<< "$candidate_commit")
            trusted_base_sha=$(git rev-parse "${candidate_sha}^1")
            projection=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files" \
              | jq -sc 'add | map({filename,status,sha}) | sort_by(.filename)')
            printf '%s\n' "$projection" > repair-projection.json
            # Re-run the trusted base parent's admission policy. Current projection
            # rules may legitimately remove generated paths after an older release.
            git checkout --detach "$trusted_base_sha"
            projection_result=$(bun run scripts/release-projection.ts \
              --base "$trusted_base_sha" \
              --head "$candidate_sha" \
              --projection repair-projection.json \
              --json)
            projection_digest=$(jq -r .projectionDigest <<< "$projection_result")
            manifest_version=$(gh api "repos/${GITHUB_REPOSITORY}/contents/plugin.config.json?ref=${candidate_sha}" --jq .content \
              | tr -d '\n' | base64 --decode | jq -r .version)
            jq -nS \
              --argjson number "$pr_number" \
              --arg baseBranch "$base_branch" \
              --arg automationIdentity "$automation_identity" \
              --arg mergeCommit "$merge_commit_sha" \
              --arg projectionDigest "$projection_digest" \
              --argjson candidateParentShas "$candidate_parent_shas" \
              --arg trustedBaseSha "$trusted_base_sha" \
              --arg mergedPrBaseSha "$merged_pr_base_sha" \
              --arg reviewedPrHeadSha "$reviewed_pr_head_sha" \
              --argjson changedFiles "$(jq '[.[].filename]' repair-projection.json)" \
              --argjson changedFileStatuses "$(jq '[.[].status]' repair-projection.json)" \
              '{number:$number,baseBranch:$baseBranch,automationIdentity:$automationIdentity,mergeCommit:$mergeCommit,changedFiles:$changedFiles,changedFileStatuses:$changedFileStatuses,projectionDigest:$projectionDigest,candidateParentShas:$candidateParentShas,trustedBaseSha:$trustedBaseSha,mergedPrBaseSha:$mergedPrBaseSha,reviewedPrHeadSha:$reviewedPrHeadSha}' \
              > trusted-repair-candidate.json
            # The historical base owns projection policy; the workflow source
            # owns the current topology and identity admission contract.
            git checkout --detach "$workflow_policy_sha"
            REPAIR_REPOSITORY="$GITHUB_REPOSITORY" \
            REPAIR_BASE_BRANCH="$BASE_BRANCH" \
            REPAIR_AUTOMATION_LOGIN="$EXPECTED_RELEASE_PLEASE_LOGIN" \
            REPAIR_TAG="$REPAIR_TAG" \
            REPAIR_SHA="$candidate_sha" \
            REPAIR_VERSION="$manifest_version" \
            REPAIR_RELEASE_TARGET_SHA="$release_target_sha" \
              bun -e '
                import { readFileSync } from "node:fs";
                import { validateRepairCandidateBinding } from "./scripts/release-validate.ts";
                const {
                  candidateParentShas,
                  trustedBaseSha,
                  mergedPrBaseSha,
                  reviewedPrHeadSha,
                  ...trustedCandidate
                } = JSON.parse(readFileSync("trusted-repair-candidate.json", "utf8"));
                validateRepairCandidateBinding({
                  candidate: JSON.parse(readFileSync("persisted-candidate.json", "utf8")),
                  trustedCandidate,
                  candidateParentShas,
                  trustedBaseSha,
                  mergedPrBaseSha,
                  reviewedPrHeadSha,
                  repository: process.env.REPAIR_REPOSITORY ?? "",
                  expectedBaseBranch: process.env.REPAIR_BASE_BRANCH ?? "",
                  expectedAutomationIdentities: [process.env.REPAIR_AUTOMATION_LOGIN ?? ""],
                  tag: process.env.REPAIR_TAG ?? "",
                  checkoutSha: process.env.REPAIR_SHA ?? "",
                  tagSha: process.env.REPAIR_SHA ?? "",
                  manifestVersion: process.env.REPAIR_VERSION ?? "",
                  releaseTargetSha: process.env.REPAIR_RELEASE_TARGET_SHA || undefined,
                });
              '
            {
              echo "mode=repair"
              echo "candidate_sha=${candidate_sha}"
              echo "release_tag=${REPAIR_TAG}"
              echo "version=${version}"
              echo "release_target_sha=${release_target_sha}"
              echo "trusted_base_sha=${trusted_base_sha}"
              echo "merged_pr_base_sha=${merged_pr_base_sha}"
              echo "reviewed_pr_head_sha=${reviewed_pr_head_sha}"
              echo "record_reused=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$PUSH_FORCED" != "false" ]]; then
            echo "Push event forced flag is not a proven non-forced push." >&2
            exit 1
          fi

          associated_prs=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
          release_prs=$(jq -c '[.[] | select(.head.ref | startswith("release-please--branches--"))]' <<< "$associated_prs")
          release_pr_count=$(jq 'length' <<< "$release_prs")
          if [[ "$release_pr_count" == "0" ]]; then
            {
              echo "mode=maintenance"
              echo "candidate_sha="
              echo "release_tag="
              echo "version="
              echo "release_target_sha="
              echo "trusted_base_sha="
              echo "merged_pr_base_sha="
              echo "reviewed_pr_head_sha="
              echo "record_reused=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$release_pr_count" != "1" ]]; then
            echo "Publication admission requires exactly one merged Release Please PR; received ${release_pr_count}." >&2
            exit 1
          fi

          release_pr=$(jq -c '.[0]' <<< "$release_prs")
          pr_number=$(jq -r .number <<< "$release_pr")
          base_branch=$(jq -r .base.ref <<< "$release_pr")
          merged_pr_base_sha=$(jq -r .base.sha <<< "$release_pr")
          reviewed_pr_head_sha=$(jq -r .head.sha <<< "$release_pr")
          automation_identity=$(jq -r .user.login <<< "$release_pr")
          merge_commit_sha=$(jq -r .merge_commit_sha <<< "$release_pr")
          merged_at=$(jq -r '.merged_at // empty' <<< "$release_pr")
          if [[ -z "$merged_at" || "$base_branch" != "$BASE_BRANCH" || "$automation_identity" != "$EXPECTED_RELEASE_PLEASE_LOGIN" || "$merge_commit_sha" != "$GITHUB_SHA" ]]; then
            echo "Release Please candidate identity, base branch, merge state, or merge_commit_sha is not bound to github.sha." >&2
            exit 1
          fi
          candidate_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")
          candidate_parent_shas=$(jq -c '[.parents[].sha]' <<< "$candidate_commit")
          if [[ ! "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ || "$PUSH_BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "Push event before SHA is not a valid pre-merge commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$PUSH_BEFORE_SHA" "$GITHUB_SHA"; then
            echo "Push event before SHA is not an ancestor of the release candidate." >&2
            exit 1
          fi
          trusted_base_sha="$PUSH_BEFORE_SHA"

          projection=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files" \
            | jq -sc 'add | map({filename,status,sha}) | sort_by(.filename)')
          printf '%s\n' "$projection" > release-projection.json
          projection_result=$(bun run scripts/release-projection.ts \
            --base "$trusted_base_sha" \
            --head "$GITHUB_SHA" \
            --projection release-projection.json \
            --json)
          projection_digest=$(jq -r .projectionDigest <<< "$projection_result")
          version=$(gh api "repos/${GITHUB_REPOSITORY}/contents/plugin.config.json?ref=${GITHUB_SHA}" --jq .content \
            | tr -d '\n' | base64 --decode | jq -r .version)
          release_tag="v${version}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Candidate tag ${release_tag} already exists; use manual incomplete-publication repair." >&2
            exit 1
          fi

          jq -nS \
            --argjson number "$pr_number" \
            --arg baseBranch "$BASE_BRANCH" \
            --arg automationIdentity "$automation_identity" \
            --arg mergeCommit "$GITHUB_SHA" \
            --arg projectionDigest "$projection_digest" \
            --argjson candidateParentShas "$candidate_parent_shas" \
            --arg trustedBaseSha "$trusted_base_sha" \
            --arg mergedPrBaseSha "$merged_pr_base_sha" \
            --arg reviewedPrHeadSha "$reviewed_pr_head_sha" \
            --argjson changedFiles "$(jq '[.[].filename]' release-projection.json)" \
            --argjson changedFileStatuses "$(jq '[.[].status]' release-projection.json)" \
            '{number:$number,baseBranch:$baseBranch,automationIdentity:$automationIdentity,mergeCommit:$mergeCommit,changedFiles:$changedFiles,changedFileStatuses:$changedFileStatuses,projectionDigest:$projectionDigest,candidateParentShas:$candidateParentShas,trustedBaseSha:$trustedBaseSha,mergedPrBaseSha:$mergedPrBaseSha,reviewedPrHeadSha:$reviewedPrHeadSha}' \
            > trusted-publication-candidate.json
          PUBLISH_REPOSITORY="$GITHUB_REPOSITORY" \
          PUBLISH_BASE_BRANCH="$BASE_BRANCH" \
          PUBLISH_AUTOMATION_LOGIN="$EXPECTED_RELEASE_PLEASE_LOGIN" \
          PUBLISH_SHA="$GITHUB_SHA" \
          PUBLISH_VERSION="$version" \
            bun -e '
              import { readFileSync } from "node:fs";
              import { admitPublicationCandidate } from "./scripts/release-validate.ts";
              const {
                candidateParentShas,
                trustedBaseSha,
                mergedPrBaseSha,
                reviewedPrHeadSha,
                ...trustedCandidate
              } = JSON.parse(readFileSync("trusted-publication-candidate.json", "utf8"));
              const admitted = admitPublicationCandidate({
                repository: process.env.PUBLISH_REPOSITORY ?? "",
                expectedBaseBranch: process.env.PUBLISH_BASE_BRANCH ?? "",
                expectedAutomationIdentities: [process.env.PUBLISH_AUTOMATION_LOGIN ?? ""],
                githubSha: process.env.PUBLISH_SHA ?? "",
                candidateParentShas,
                trustedBaseSha,
                mergedPrBaseSha,
                reviewedPrHeadSha,
                manifestVersion: process.env.PUBLISH_VERSION ?? "",
                tagExists: false,
                candidates: [trustedCandidate],
              });
              process.stdout.write(JSON.stringify(admitted) + "\n");
            ' > candidate.json

          record_reused=false
          artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=publication-candidate-${GITHUB_SHA}" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
          if [[ -n "$artifact_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > prior-candidate.zip
            unzip -p prior-candidate.zip candidate.json > prior-candidate.json
            if ! cmp --silent candidate.json prior-candidate.json; then
              echo "Persisted publication candidate record is rebound to another release state." >&2
              exit 1
            fi
            record_reused=true
          fi
          {
            echo "mode=publish"
            echo "candidate_sha=${GITHUB_SHA}"
            echo "release_tag=${release_tag}"
            echo "version=${version}"
            echo "release_target_sha="
            echo "trusted_base_sha=${trusted_base_sha}"
            echo "merged_pr_base_sha=${merged_pr_base_sha}"
            echo "reviewed_pr_head_sha=${reviewed_pr_head_sha}"
            echo "record_reused=${record_reused}"
          } >> "$GITHUB_OUTPUT"
      - name: Persist publication candidate before proof
        if: steps.resolve.outputs.mode == 'publish' && steps.resolve.outputs.record_reused != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-candidate-${{ github.sha }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.resolve.outputs.mode != 'maintenance'
        with:
          ref: ${{ steps.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.resolve.outputs.mode != 'maintenance'
        with:
          bun-version: 1.3.14
      - name: Validate candidate metadata before proof
        if: steps.resolve.outputs.mode == 'publish'
        env:
          EXPECTED_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          actual_version=$(bun run release:validate -- --json | jq -r .version)
          [[ "$actual_version" == "$EXPECTED_VERSION" ]]
  maintain:
    name: Maintain Release Please PR only
    if: needs.resolve.outputs.mode == 'maintenance'
    needs: resolve
    concurrency:
      group: release-maintenance
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin only the first release to v0.1.0
        id: bootstrap-version
        shell: bash
        run: |
          set -euo pipefail
          release_as=""
          if [[ "$(jq 'length' .github/.release-please-manifest.json)" == "0" ]]; then
            release_as="0.1.0"
          fi
          echo "release_as=${release_as}" >> "$GITHUB_OUTPUT"
      - name: Verify configured Release Please identity
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          EXPECTED_RELEASE_PLEASE_LOGIN: ${{ vars.RELEASE_PLEASE_AUTOMATION_LOGIN || 'github-actions[bot]' }}
        run: |
          set -euo pipefail
          actual_login=$(gh api user --jq .login)
          if [[ "$actual_login" != "$EXPECTED_RELEASE_PLEASE_LOGIN" ]]; then
            echo "Release Please token identity ${actual_login} does not match configured identity ${EXPECTED_RELEASE_PLEASE_LOGIN}." >&2
            exit 1
          fi
      # skip-github-release is set in release-please config. The action may maintain PRs but cannot tag or create a GitHub Release.
      - name: Maintain release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          release-as: ${{ steps.bootstrap-version.outputs.release_as }}

  candidate:
    name: Build release candidate once
    if: needs.resolve.outputs.mode == 'publish' || needs.resolve.outputs.mode == 'repair'
    needs: resolve
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Package the resolved release candidate
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.candidate_sha }}
        run: bun run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-platform-candidate-${{ github.run_id }}
          overwrite: true
          path: |
            dist/*.tar.gz
            dist/*.checksums.json
          if-no-files-found: error

  compatibility:
    name: Release compatibility (${{ matrix.target }})
    if: needs.resolve.outputs.mode == 'publish'
    needs:
      - resolve
      - candidate
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Download the single packaged candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: release-platform-candidate-${{ github.run_id }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/platform-candidate"
      - name: Prove packaged runtime custody on this target
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find "$RUNNER_TEMP/platform-candidate" -maxdepth 1 -name '*.tar.gz' -print -quit)
          checksums=$(find "$RUNNER_TEMP/platform-candidate" -maxdepth 1 -name '*.checksums.json' -print -quit)
          [[ -n "$archive" && -n "$checksums" ]]
          bun run prove:runtime-platform -- \
            --archive "$archive" \
            --checksums "$checksums" \
            --target "${{ matrix.target }}" \
            --fixture-acknowledged

  package:
    name: Prove release candidate
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.candidate.result == 'success' &&
      (needs.resolve.outputs.mode == 'publish' || needs.resolve.outputs.mode == 'repair') &&
      (needs.compatibility.result == 'success' ||
        (needs.resolve.outputs.mode == 'repair' && needs.compatibility.result == 'skipped'))
    needs:
      - resolve
      - candidate
      - compatibility
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install pinned native marketplace CLIs
        run: bun add --global "@anthropic-ai/claude-code@2.1.222" "@openai/codex@0.146.1"
      - name: Download the platform-proven release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: release-platform-candidate-${{ github.run_id }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/platform-candidate"
      - name: Validate and prove release payload
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.candidate_sha }}
        run: |
          bun run prove:all
      - name: Compare the rebuilt package with the platform-proven candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_archive=$(find "$RUNNER_TEMP/platform-candidate" -maxdepth 1 -name '*.tar.gz' -print -quit)
          candidate_checksums=$(find "$RUNNER_TEMP/platform-candidate" -maxdepth 1 -name '*.checksums.json' -print -quit)
          rebuilt_archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          rebuilt_checksums=$(find dist -maxdepth 1 -name '*.checksums.json' -print -quit)
          [[ -n "$candidate_archive" && -n "$candidate_checksums" && -n "$rebuilt_archive" && -n "$rebuilt_checksums" ]]
          cmp --silent "$candidate_archive" "$rebuilt_archive"
          cmp --silent "$candidate_checksums" "$rebuilt_checksums"
      - name: Reject generated release-surface drift
        run: git diff --exit-code -- plugin/
      - name: Bind checksum metadata to candidate
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          checksums=$(find "$RUNNER_TEMP/platform-candidate" -maxdepth 1 -name '*.checksums.json' -print -quit)
          [[ -n "$checksums" ]]
          checksums_repository=$(jq -er .repository "$checksums")
          checksums_repository_identity=$(bun -e 'import { canonicalGitHubRepositoryIdentity } from "./scripts/release-validate.ts"; process.stdout.write(canonicalGitHubRepositoryIdentity(process.argv.at(-1) ?? ""))' "$checksums_repository")
          expected_repository_identity=$(bun -e 'import { canonicalGitHubRepositoryIdentity } from "./scripts/release-validate.ts"; process.stdout.write(canonicalGitHubRepositoryIdentity(process.argv.at(-1) ?? ""))' "$GITHUB_REPOSITORY")
          if [[ "$checksums_repository_identity" != "$expected_repository_identity" ]]; then
            echo "Packaged GitHub repository does not match the workflow repository." >&2
            exit 1
          fi
          jq -e \
            --arg sourceCommit "$CANDIDATE_SHA" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$VERSION" \
            '.sourceCommit == $sourceCommit and .tag == $tag and .version == $version' \
            "$checksums"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          overwrite: true
          path: |
            ${{ runner.temp }}/platform-candidate/*.tar.gz
            ${{ runner.temp }}/platform-candidate/*.checksums.json
          if-no-files-found: error

  release:
    name: Publish or repair immutable release
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.package.result == 'success' &&
      (needs.resolve.outputs.mode == 'publish' || needs.resolve.outputs.mode == 'repair')
    needs:
      - resolve
      - package
    concurrency:
      group: release-publication-${{ needs.resolve.outputs.release_tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Download proven release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: release-candidate-${{ github.run_id }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist
      - name: Download persisted publication candidate
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.resolve.outputs.mode }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "repair" ]]; then
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
              echo "Repair requires an annotated immutable tag carrying its publication admission." >&2
              exit 1
            fi
            git for-each-ref --format='%(contents)' "refs/tags/${RELEASE_TAG}" > persisted-candidate.json
            exit 0
          fi
          artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=publication-candidate-${CANDIDATE_SHA}" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
          if [[ -z "$artifact_id" ]]; then
            echo "Release requires the persisted publication candidate for ${CANDIDATE_SHA}." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > publication-candidate.zip
          unzip -p publication-candidate.zip candidate.json > persisted-candidate.json
      - name: Replay current publication admission before mutation
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.resolve.outputs.mode }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          TRUSTED_BASE_SHA: ${{ needs.resolve.outputs.trusted_base_sha }}
          ADMITTED_MERGED_PR_BASE_SHA: ${{ needs.resolve.outputs.merged_pr_base_sha }}
          ADMITTED_REVIEWED_PR_HEAD_SHA: ${{ needs.resolve.outputs.reviewed_pr_head_sha }}
          CURRENT_WORKFLOW_SHA: ${{ github.sha }}
          BASE_BRANCH: main
          EXPECTED_RELEASE_PLEASE_LOGIN: ${{ vars.RELEASE_PLEASE_AUTOMATION_LOGIN || 'github-actions[bot]' }}
        run: |
          set -euo pipefail
          checkout_sha=$(git rev-parse HEAD)
          if [[ "$checkout_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Release admission replay is not checked out at the proven candidate SHA." >&2
            exit 1
          fi
          pr_number=$(jq -er '.pullRequest | select(type == "number" and . > 0 and . == floor)' persisted-candidate.json)
          admitted_automation_identity=$(jq -er '.automationIdentity | select(type == "string" and length > 0)' persisted-candidate.json)
          if [[ "$admitted_automation_identity" != "$EXPECTED_RELEASE_PLEASE_LOGIN" ]]; then
            echo "Persisted publication identity does not match the configured Release Please identity." >&2
            exit 1
          fi
          release_pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
          base_branch=$(jq -r .base.ref <<< "$release_pr")
          merged_pr_base_sha=$(jq -r .base.sha <<< "$release_pr")
          reviewed_pr_head_sha=$(jq -r .head.sha <<< "$release_pr")
          automation_identity=$(jq -r .user.login <<< "$release_pr")
          merge_commit_sha=$(jq -r .merge_commit_sha <<< "$release_pr")
          merged_at=$(jq -r '.merged_at // empty' <<< "$release_pr")
          if [[ "$automation_identity" != "$EXPECTED_RELEASE_PLEASE_LOGIN" ]]; then
            echo "Fresh publication PR identity does not match the configured Release Please identity." >&2
            exit 1
          fi
          if [[ -z "$merged_at" || "$base_branch" != "$BASE_BRANCH" || "$merge_commit_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Publication provenance no longer matches the admitted Release Please candidate." >&2
            exit 1
          fi
          if [[ "$merged_pr_base_sha" != "$ADMITTED_MERGED_PR_BASE_SHA" || "$reviewed_pr_head_sha" != "$ADMITTED_REVIEWED_PR_HEAD_SHA" ]]; then
            echo "Publication topology changed after initial admission." >&2
            exit 1
          fi
          candidate_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}")
          candidate_parent_shas=$(jq -c '[.parents[].sha]' <<< "$candidate_commit")
          trusted_base_sha="$TRUSTED_BASE_SHA"
          replayed_first_parent=$(git rev-parse "${CANDIDATE_SHA}^1")
          if [[ ! "$trusted_base_sha" =~ ^[0-9a-f]{40}$ || "$trusted_base_sha" != "$replayed_first_parent" ]]; then
            echo "Release admission replay does not match the original trusted base." >&2
            exit 1
          fi
          projection=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files" \
            | jq -sc 'add | map({filename,status,sha}) | sort_by(.filename)')
          printf '%s\n' "$projection" > replay-projection.json
          # The candidate's first parent owns its historical projection policy.
          git checkout --detach "$trusted_base_sha"
          projection_result=$(bun run scripts/release-projection.ts \
            --base "$trusted_base_sha" \
            --head "$CANDIDATE_SHA" \
            --projection replay-projection.json \
            --json)
          projection_digest=$(jq -r .projectionDigest <<< "$projection_result")
          manifest_version=$(gh api "repos/${GITHUB_REPOSITORY}/contents/plugin.config.json?ref=${CANDIDATE_SHA}" --jq .content \
            | tr -d '\n' | base64 --decode | jq -r .version)
          jq -nS \
            --argjson number "$pr_number" \
            --arg baseBranch "$base_branch" \
            --arg automationIdentity "$automation_identity" \
            --arg mergeCommit "$merge_commit_sha" \
            --arg projectionDigest "$projection_digest" \
            --argjson candidateParentShas "$candidate_parent_shas" \
            --arg trustedBaseSha "$trusted_base_sha" \
            --arg mergedPrBaseSha "$merged_pr_base_sha" \
            --arg reviewedPrHeadSha "$reviewed_pr_head_sha" \
            --argjson changedFiles "$(jq '[.[].filename]' replay-projection.json)" \
            --argjson changedFileStatuses "$(jq '[.[].status]' replay-projection.json)" \
            '{number:$number,baseBranch:$baseBranch,automationIdentity:$automationIdentity,mergeCommit:$mergeCommit,changedFiles:$changedFiles,changedFileStatuses:$changedFileStatuses,projectionDigest:$projectionDigest,candidateParentShas:$candidateParentShas,trustedBaseSha:$trustedBaseSha,mergedPrBaseSha:$mergedPrBaseSha,reviewedPrHeadSha:$reviewedPrHeadSha}' \
            > replay-trusted-candidate.json
          # The current workflow source owns the current identity and topology contract.
          git fetch --no-tags origin "$CURRENT_WORKFLOW_SHA"
          git checkout --detach "$CURRENT_WORKFLOW_SHA"
          if [[ "$MODE" == "repair" ]]; then
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            repair_tag_sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
            repair_release_target_sha=""
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              repair_release_target=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
              repair_release_target_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${repair_release_target}" --jq .sha)
            fi
            REPAIR_REPOSITORY="$GITHUB_REPOSITORY" \
            REPAIR_BASE_BRANCH="$BASE_BRANCH" \
            REPAIR_AUTOMATION_LOGIN="$EXPECTED_RELEASE_PLEASE_LOGIN" \
            REPAIR_TAG="$RELEASE_TAG" \
            REPAIR_CHECKOUT_SHA="$CANDIDATE_SHA" \
            REPAIR_TAG_SHA="$repair_tag_sha" \
            REPAIR_VERSION="$manifest_version" \
            REPAIR_RELEASE_TARGET_SHA="$repair_release_target_sha" \
              bun -e '
                import { readFileSync } from "node:fs";
                import { validateRepairCandidateBinding } from "./scripts/release-validate.ts";
                const {
                  candidateParentShas,
                  trustedBaseSha,
                  mergedPrBaseSha,
                  reviewedPrHeadSha,
                  ...trustedCandidate
                } = JSON.parse(readFileSync("replay-trusted-candidate.json", "utf8"));
                validateRepairCandidateBinding({
                  candidate: JSON.parse(readFileSync("persisted-candidate.json", "utf8")),
                  trustedCandidate,
                  candidateParentShas,
                  trustedBaseSha,
                  mergedPrBaseSha,
                  reviewedPrHeadSha,
                  repository: process.env.REPAIR_REPOSITORY ?? "",
                  expectedBaseBranch: process.env.REPAIR_BASE_BRANCH ?? "",
                  expectedAutomationIdentities: [process.env.REPAIR_AUTOMATION_LOGIN ?? ""],
                  tag: process.env.REPAIR_TAG ?? "",
                  checkoutSha: process.env.REPAIR_CHECKOUT_SHA ?? "",
                  tagSha: process.env.REPAIR_TAG_SHA ?? "",
                  manifestVersion: process.env.REPAIR_VERSION ?? "",
                  releaseTargetSha: process.env.REPAIR_RELEASE_TARGET_SHA || undefined,
                });
              '
          else
            publish_tag_exists=false
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              publish_tag_exists=true
            fi
            PUBLISH_REPOSITORY="$GITHUB_REPOSITORY" \
            PUBLISH_BASE_BRANCH="$BASE_BRANCH" \
            PUBLISH_AUTOMATION_LOGIN="$EXPECTED_RELEASE_PLEASE_LOGIN" \
            PUBLISH_SHA="$CANDIDATE_SHA" \
            PUBLISH_VERSION="$manifest_version" \
            PUBLISH_TAG_EXISTS="$publish_tag_exists" \
              bun -e '
                import { readFileSync } from "node:fs";
                import { admitPublicationCandidate } from "./scripts/release-validate.ts";
                const {
                  candidateParentShas,
                  trustedBaseSha,
                  mergedPrBaseSha,
                  reviewedPrHeadSha,
                  ...trustedCandidate
                } = JSON.parse(readFileSync("replay-trusted-candidate.json", "utf8"));
                admitPublicationCandidate({
                  repository: process.env.PUBLISH_REPOSITORY ?? "",
                  expectedBaseBranch: process.env.PUBLISH_BASE_BRANCH ?? "",
                  expectedAutomationIdentities: [process.env.PUBLISH_AUTOMATION_LOGIN ?? ""],
                  githubSha: process.env.PUBLISH_SHA ?? "",
                  candidateParentShas,
                  trustedBaseSha,
                  mergedPrBaseSha,
                  reviewedPrHeadSha,
                  manifestVersion: process.env.PUBLISH_VERSION ?? "",
                  tagExists: process.env.PUBLISH_TAG_EXISTS === "true",
                  candidates: [trustedCandidate],
                  priorRecord: JSON.parse(readFileSync("persisted-candidate.json", "utf8")),
                });
              '
          fi
          git checkout --detach "$CANDIDATE_SHA"
          if [[ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]]; then
            echo "Release admission replay did not restore the proven candidate checkout." >&2
            exit 1
          fi
      - name: Create or verify immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.resolve.outputs.mode }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          load_remote_tag() {
            remote_tag_object=$(git ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')
            remote_tag_sha=""
            if [[ -z "$remote_tag_object" ]]; then
              return
            fi
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
              echo "Immutable release tag must be annotated with its publication admission." >&2
              exit 1
            fi
            remote_tag_sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
            git for-each-ref --format='%(contents)' "refs/tags/${RELEASE_TAG}" > tag-candidate.json
            jq -S . persisted-candidate.json > expected-tag-candidate.json
            jq -S . tag-candidate.json > actual-tag-candidate.json
            if ! cmp --silent expected-tag-candidate.json actual-tag-candidate.json; then
              echo "Immutable release tag carries a different publication admission." >&2
              exit 1
            fi
          }
          local_tag_sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null || true)
          if [[ -n "$local_tag_sha" ]]; then
            if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
              echo "Local release tag must be annotated with its publication admission." >&2
              exit 1
            fi
            git for-each-ref --format='%(contents)' "refs/tags/${RELEASE_TAG}" > local-tag-candidate.json
            jq -S . persisted-candidate.json > expected-local-tag-candidate.json
            jq -S . local-tag-candidate.json > actual-local-tag-candidate.json
            if ! cmp --silent expected-local-tag-candidate.json actual-local-tag-candidate.json; then
              echo "Local release tag carries a different publication admission." >&2
              exit 1
            fi
          fi
          load_remote_tag
          if [[ -n "$remote_tag_sha" && "$remote_tag_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Immutable remote tag does not target the proven candidate SHA." >&2
            exit 1
          fi
          if [[ -z "$remote_tag_sha" && "$MODE" == "publish" ]]; then
            if [[ -n "$local_tag_sha" && "$local_tag_sha" != "$CANDIDATE_SHA" ]]; then
              echo "Local release tag does not target the proven candidate SHA." >&2
              exit 1
            fi
            if [[ -z "$local_tag_sha" ]]; then
              git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                tag -a "$RELEASE_TAG" "$CANDIDATE_SHA" -F persisted-candidate.json
            fi
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
          load_remote_tag
          if [[ -z "$remote_tag_sha" || "$remote_tag_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Immutable remote tag does not target the proven candidate SHA." >&2
            exit 1
          fi
      - name: Create missing GitHub Release and validate target
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$CANDIDATE_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          release_target=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
          release_target_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_target}" --jq .sha)
          remote_tag_sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ "$remote_tag_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Immutable remote tag does not target the proven candidate SHA." >&2
            exit 1
          fi
          if [[ "$release_target_sha" != "$CANDIDATE_SHA" ]]; then
            echo "GitHub Release target does not match the proven candidate SHA." >&2
            exit 1
          fi
      - name: Compare release assets before mutation
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.resolve.outputs.mode }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          REPLACE_MISMATCHED_ASSETS: ${{ inputs.replace_mismatched_assets || false }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p remote-assets
          : > asset-actions.tsv
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > remote-assets.txt
          archives=(dist/*.tar.gz)
          checksums=(dist/*.checksums.json)
          if (( ${#archives[@]} != 1 || ${#checksums[@]} != 1 )); then
            echo "Expected exactly one dist/*.tar.gz and one dist/*.checksums.json release asset." >&2
            exit 1
          fi
          assets=("${archives[@]}" "${checksums[@]}")
          : > expected-assets.txt
          for asset in "${assets[@]}"; do
            basename "$asset" >> expected-assets.txt
          done
          sort -u -o expected-assets.txt expected-assets.txt
          sort -u -o remote-assets.txt remote-assets.txt
          unexpected_assets=$(comm -13 expected-assets.txt remote-assets.txt)
          if [[ -n "$unexpected_assets" ]]; then
            echo "GitHub Release contains unexpected unproven assets:" >&2
            printf '%s\n' "$unexpected_assets" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            name=$(basename "$asset")
            local_digest=$(sha256sum "$asset" | awk '{print $1}')
            if grep -Fxq "$name" remote-assets.txt; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir remote-assets
              remote_digest=$(sha256sum "remote-assets/$name" | awk '{print $1}')
              if [[ "$remote_digest" == "$local_digest" ]]; then
                continue
              fi
              if [[ "$MODE" != "repair" || "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$REPLACE_MISMATCHED_ASSETS" != "true" ]]; then
                echo "Existing asset $name differs; replacement requires explicit same-tag repair authority." >&2
                exit 1
              fi
              printf 'replace\t%s\n' "$asset" >> asset-actions.tsv
            else
              printf 'add\t%s\n' "$asset" >> asset-actions.tsv
            fi
          done
      - name: Add or replace admitted release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r action asset; do
            [[ -n "$action" ]] || continue
            case "$action" in
              add) gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" ;;
              replace) gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber ;;
              *) echo "Unsupported release asset action: ${action}." >&2; exit 1 ;;
            esac
          done < asset-actions.tsv
      - name: Check for existing matching public attestation
        id: attestation
        if: github.event.repository.private == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          if gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Add missing public release attestation
        if: github.event.repository.private == false && steps.attestation.outputs.needed == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*.tar.gz
      - name: Reconcile Release Please lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number=$(jq -er '.pullRequest | select(type == "number" and . > 0 and . == floor)' persisted-candidate.json)
          labels_endpoint="repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels"

          gh api --method POST "$labels_endpoint" -f 'labels[]=autorelease: tagged' >/dev/null
          current_labels=$(gh api --paginate "$labels_endpoint" --jq '.[].name')
          if grep -Fxq 'autorelease: pending' <<< "$current_labels"; then
            gh api --method DELETE "${labels_endpoint}/autorelease%3A%20pending" >/dev/null
          fi

          current_labels=$(gh api --paginate "$labels_endpoint" --jq '.[].name')
          if ! grep -Fxq 'autorelease: tagged' <<< "$current_labels" || grep -Fxq 'autorelease: pending' <<< "$current_labels"; then
            echo "Release Please lineage did not converge for PR ${pr_number}." >&2
            exit 1
          fi

  converge:
    name: Require release operation convergence
    if: always()
    needs:
      - resolve
      - maintain
      - candidate
      - compatibility
      - package
      - release
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the requested release operation to complete
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          MAINTAIN_RESULT: ${{ needs.maintain.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          set -euo pipefail
          converged=false
          if [[ "$RESOLVE_RESULT" == "success" ]]; then
            case "$MODE" in
              maintenance)
                [[ "$MAINTAIN_RESULT" == "success" &&
                  "$CANDIDATE_RESULT" == "skipped" &&
                  "$COMPATIBILITY_RESULT" == "skipped" &&
                  "$PACKAGE_RESULT" == "skipped" &&
                  "$RELEASE_RESULT" == "skipped" ]] && converged=true
                ;;
              publish)
                [[ "$MAINTAIN_RESULT" == "skipped" &&
                  "$CANDIDATE_RESULT" == "success" &&
                  "$COMPATIBILITY_RESULT" == "success" &&
                  "$PACKAGE_RESULT" == "success" &&
                  "$RELEASE_RESULT" == "success" ]] && converged=true
                ;;
              repair)
                [[ "$MAINTAIN_RESULT" == "skipped" &&
                  "$CANDIDATE_RESULT" == "success" &&
                  "$COMPATIBILITY_RESULT" == "skipped" &&
                  "$PACKAGE_RESULT" == "success" &&
                  "$RELEASE_RESULT" == "success" ]] && converged=true
                ;;
            esac
          fi
          if [[ "$converged" != "true" ]]; then
            echo "Release operation did not converge: mode=${MODE:-unset} resolve=$RESOLVE_RESULT maintain=$MAINTAIN_RESULT candidate=$CANDIDATE_RESULT compatibility=$COMPATIBILITY_RESULT package=$PACKAGE_RESULT release=$RELEASE_RESULT." >&2
            exit 1
          fi
