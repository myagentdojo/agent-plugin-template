name: Opt-in Codex review gate

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  issue_comment:
    types:
      - created
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  pull-requests: read
  statuses: write

env:
  STATUS_CONTEXT: Codex review gate

jobs:
  initialize:
    name: Default to review not requested
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      - name: Mark the optional gate successful
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --raw-field state=success \
            --raw-field context="${STATUS_CONTEXT}" \
            --raw-field description="Codex review not requested" \
            --raw-field target_url="${PR_URL}"

  request:
    name: Arm the gate when review is requested
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null
    runs-on: ubuntu-24.04
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENTER: ${{ github.event.comment.user.login }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Mark the current PR commit pending
        shell: bash
        run: |
          shopt -s nocasematch
          if [[ ! "${COMMENT_BODY}" =~ ^[[:space:]]*@codex[[:space:]]+review([[:space:]]|$) ]]; then
            exit 0
          fi

          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${COMMENTER}/permission" --jq .permission)"
          case "${permission}" in
            admin|maintain|write) ;;
            *)
              echo "Ignoring review request from a user without write permission."
              exit 0
              ;;
          esac

          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          pr_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            --raw-field state=pending \
            --raw-field context="${STATUS_CONTEXT}" \
            --raw-field description="Codex review in progress" \
            --raw-field target_url="${pr_url}"

  complete:
    name: Release the gate after Codex reviews the current commit
    if: github.event_name == 'pull_request_review' && github.event.review.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Mark the reviewed PR commit successful
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
        run: |
          if [[ "${REVIEW_SHA}" != "${HEAD_SHA}" ]]; then
            echo "Ignoring a Codex review for a stale PR commit."
            exit 0
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --raw-field state=success \
            --raw-field context="${STATUS_CONTEXT}" \
            --raw-field description="Codex review complete" \
            --raw-field target_url="${PR_URL}"
