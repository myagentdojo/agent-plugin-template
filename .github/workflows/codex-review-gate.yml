name: Opt-in Codex review gate

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: read
  statuses: write

env:
  STATUS_CONTEXT: Codex review gate

jobs:
  initialize:
    name: Default to review not requested
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      - name: Mark the optional gate successful
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --raw-field state=success \
            --raw-field context="${STATUS_CONTEXT}" \
            --raw-field description="Codex review not requested" \
            --raw-field target_url="${PR_URL}"

  request:
    name: Arm the gate when review is requested
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null
    runs-on: ubuntu-24.04
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENTER: ${{ github.event.comment.user.login }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Mark the current PR commit pending
        shell: bash
        run: |
          shopt -s nocasematch
          if [[ ! "${COMMENT_BODY}" =~ ^[[:space:]]*@codex[[:space:]]+review([[:space:]]|$) ]]; then
            exit 0
          fi

          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${COMMENTER}/permission" --jq .permission)"
          case "${permission}" in
            admin|maintain|write) ;;
            *)
              echo "Ignoring review request from a user without write permission."
              exit 0
              ;;
          esac

          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          pr_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            --raw-field state=pending \
            --raw-field context="${STATUS_CONTEXT}" \
            --raw-field description="Codex review in progress" \
            --raw-field target_url="${pr_url}"

  complete-comment:
    name: Release the gate after a clean Codex review comment
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-24.04
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      CLEAN_REVIEW_MARKER: '^Codex Review: Didn''t find any major issues\.([[:space:]]+Keep it up!|[[:space:]]+Bravo\.|[[:space:]]+Another round soon, please!|[[:space:]]+You''re on a roll\.|[[:space:]]+:\+1:)?[[:space:]]*$'
      REVIEW_MARKER: '^\*\*Reviewed commit:\*\* `([0-9a-f]{10,40})`[[:space:]]*$'
    steps:
      - name: Mark the reviewed PR commit successful
        shell: bash
        run: |
          details_marker=$'\n<details> <summary>ℹ️ About Codex in GitHub</summary>'
          if [[ "${COMMENT_BODY}" != *"${details_marker}"* ]] ||
            [[ ! "${COMMENT_BODY}" =~ \</details\>[[:space:]]*$ ]]; then
            echo "Ignoring a Codex comment without the expected informational-details boundary."
            exit 0
          fi

          review_payload="${COMMENT_BODY%%"${details_marker}"*}"
          payload_line_count=0
          clean_line=""
          review_line=""
          while IFS= read -r line; do
            [[ "${line}" =~ ^[[:space:]]*$ ]] && continue
            payload_line_count=$((payload_line_count + 1))
            case "${payload_line_count}" in
              1) clean_line="${line}" ;;
              2) review_line="${line}" ;;
            esac
          done <<< "${review_payload}"
          if (( payload_line_count != 2 )) || [[ ! "${clean_line}" =~ ${CLEAN_REVIEW_MARKER} ]]; then
            echo "Ignoring a Codex comment that is not an exact clean-review payload."
            exit 0
          fi

          if [[ ! "${review_line}" =~ ${REVIEW_MARKER} ]]; then
            echo "Ignoring a Codex comment without an exact reviewed-commit marker."
            exit 0
          fi
          reviewed_prefix="${BASH_REMATCH[1]}"
          if [[ ! "${reviewed_prefix}" =~ ^[0-9a-f]{10,40}$ ]]; then
            echo "Ignoring a Codex comment without an exact reviewed-commit marker."
            exit 0
          fi

          HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          if [[ "${HEAD_SHA}" != "${reviewed_prefix}"* ]]; then
            echo "Ignoring a Codex review comment for a stale PR commit."
            exit 0
          fi

          PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --raw-field state=success \
            --raw-field context="${STATUS_CONTEXT}" \
            --raw-field description="Codex review complete" \
            --raw-field target_url="${PR_URL}"
